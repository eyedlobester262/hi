name: Build Pixel Scallop Clock APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'PixelScallopClock-Rebuilt-Project-v6.zip'
      - '.github/workflows/build-scallop-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          mkdir project
          unzip -q PixelScallopClock-Rebuilt-Project-v6.zip -d project
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-scallop-clock-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
