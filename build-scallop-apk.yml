name: Build Scallop Clock APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ScallopClockWidget-Project.zip'
      - 'ScallopClockWidget-Fixed-Project.zip'
      - '.github/workflows/build-scallop-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          if [ -f ScallopClockWidget-Fixed-Project.zip ]; then
            unzip -q ScallopClockWidget-Fixed-Project.zip -d project
          else
            unzip -q ScallopClockWidget-Project.zip -d project
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scallop-clock-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
